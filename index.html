<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title><!-- Updated by JS from CONFIG -->
  <meta name="description" content="Portfolio" /><!-- Updated by JS from CONFIG -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ─────────────────────────────────────────────
       DESIGN TOKENS
       ───────────────────────────────────────────── */
    :root {
      --bg:          #0A0E1A;
      --bg-surface:  #111827;
      --bg-raised:   #1A2235;
      --border:      rgba(255,255,255,0.07);
      --border-hover:rgba(255,255,255,0.16);
      --text:        #E2D9CC;
      --text-dim:    #7A7265;
      --text-muted:  #4A4540;
      --accent:      #D4A843;
      --accent-dim:  rgba(212,168,67,0.15);
      --teal:        #5CC8C8;
      --teal-dim:    rgba(92,200,200,0.12);
      --violet:      #9B8FE0;
      --violet-dim:  rgba(155,143,224,0.12);
      --green:       #6EC97A;
      --green-dim:   rgba(110,201,122,0.12);
      --font-display:"Cormorant Garamond", Georgia, serif;
      --font-body:   "IBM Plex Sans", sans-serif;
      --font-mono:   "IBM Plex Mono", monospace;
      --nav-h:       64px;
      --max-w:       1100px;
      --radius:      6px;
      --ease:        cubic-bezier(0.4,0,0.2,1);
    }

    /* ─────────────────────────────────────────────
       RESET & BASE
       ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 400;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    img { display: block; max-width: 100%; border-radius: var(--radius); }

    /* Dot-grid background texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─────────────────────────────────────────────
       LAYOUT UTILITIES
       ───────────────────────────────────────────── */
    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 32px;
    }
    section {
      position: relative;
      z-index: 1;
      padding: 96px 0;
    }
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 600;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 48px;
    }
    .section-title em {
      font-style: italic;
      font-weight: 300;
      color: var(--text-dim);
    }

    /* Scroll-reveal */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.65s var(--ease), transform 0.65s var(--ease);
    }
    .reveal.visible {
      opacity: 1;
      transform: none;
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    /* ─────────────────────────────────────────────
       NAVIGATION
       ───────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 100;
      transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
      border-bottom: 1px solid transparent;
    }
    nav.scrolled {
      background: rgba(10,14,26,0.92);
      backdrop-filter: blur(12px);
      border-color: var(--border);
    }
    .nav-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 32px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }
    .nav-logo span {
      color: var(--accent);
    }
    .nav-links {
      display: flex;
      gap: 36px;
      align-items: center;
    }
    .nav-links a {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--text);
    }
    .nav-links .btn-resume {
      padding: 7px 16px;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      transition: background 0.2s, color 0.2s;
    }
    .nav-links .btn-resume:hover {
      background: var(--accent-dim);
    }
    /* Hamburger (mobile) */
    .nav-hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
    }
    .nav-hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: all 0.3s;
    }

    /* ─────────────────────────────────────────────
       HERO
       ───────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 0;
      overflow: hidden;
    }
    .hero-inner {
      padding-top: var(--nav-h);
      width: 100%;
    }
    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease) 0.2s forwards;
    }
    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-weight: 600;
      line-height: 1.0;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 0.9s var(--ease) 0.35s forwards;
    }
    .hero-name-sub {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 4.8rem);
      font-weight: 300;
      font-style: italic;
      color: var(--text-dim);
      line-height: 1.0;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.9s var(--ease) 0.5s forwards;
    }
    .hero-desc {
      max-width: 520px;
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-dim);
      line-height: 1.75;
      margin-bottom: 44px;
      opacity: 0;
      animation: fadeUp 0.9s var(--ease) 0.65s forwards;
    }
    .hero-ctas {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.9s var(--ease) 0.8s forwards;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--accent);
      color: var(--bg);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      border-radius: var(--radius);
      font-weight: 500;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-2px); }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border: 1px solid var(--border-hover);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      border-radius: var(--radius);
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      transform: translateY(-2px);
    }
    .hero-scroll-hint {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeUp 1s var(--ease) 1.4s forwards;
    }
    .hero-scroll-hint span {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .scroll-line {
      width: 1px;
      height: 36px;
      background: linear-gradient(to bottom, var(--text-muted), transparent);
      animation: scrollPulse 2s ease-in-out 2s infinite;
    }
    /* Decorative large background letters */
    .hero-bg-text {
      position: absolute;
      top: 50%;
      right: -4%;
      transform: translateY(-50%);
      font-family: var(--font-display);
      font-size: clamp(12rem, 25vw, 22rem);
      font-weight: 600;
      color: rgba(255,255,255,0.018);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      z-index: 0;
    }

    /* ─────────────────────────────────────────────
       ABOUT
       ───────────────────────────────────────────── */
    #about {
      background: var(--bg-surface);
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: start;
    }
    .about-text p {
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-dim);
      line-height: 1.8;
      margin-bottom: 20px;
    }
    .about-text p strong {
      color: var(--text);
      font-weight: 500;
    }
    .about-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 40px;
    }
    .stat-card {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-raised);
      transition: border-color 0.3s;
    }
    .stat-card:hover { border-color: var(--border-hover); }
    .stat-num {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .about-info-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .info-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .info-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.9rem;
    }
    .info-content .info-key {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .info-content .info-val {
      font-size: 0.9rem;
      color: var(--text);
    }
    .info-content .info-val a:hover { color: var(--accent); }

    /* ─────────────────────────────────────────────
       SKILLS
       ───────────────────────────────────────────── */
    #skills {}
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }
    .skill-group {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-surface);
      transition: border-color 0.3s, transform 0.3s;
    }
    .skill-group:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
    }
    .skill-group-icon {
      font-size: 1.4rem;
      margin-bottom: 12px;
    }
    .skill-group-name {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .skill-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-dim);
      background: var(--bg-raised);
      transition: border-color 0.2s, color 0.2s;
    }
    .skill-group:hover .chip {
      border-color: rgba(255,255,255,0.12);
      color: var(--text);
    }

    /* ─────────────────────────────────────────────
       PROJECTS
       ───────────────────────────────────────────── */
    #projects {
      background: var(--bg-surface);
    }
    .projects-filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .filter-btn {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 24px;
    }
    .project-card {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-raised);
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      position: relative;
      cursor: pointer;
    }
    .project-card.featured { grid-column: span 6; }
    .project-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-6px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .project-card.hidden { display: none; }

    /* Color accent bar by category */
    .project-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .project-card:hover::before { opacity: 1; }
    .project-card[data-cat="IoT & Hardware"]::before       { background: var(--accent); }
    .project-card[data-cat="AI & Machine Learning"]::before{ background: var(--teal); }
    .project-card[data-cat="Physics Research"]::before     { background: var(--violet); }
    .project-card[data-cat="Software"]::before             { background: var(--green); }

    .project-image-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: var(--bg-surface);
      position: relative;
    }
    .project-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s var(--ease);
      border-radius: 0;
    }
    .project-card:hover .project-image-wrap img { transform: scale(1.04); }
    .project-image-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .project-image-placeholder .placeholder-icon {
      font-size: 2.5rem;
      opacity: 0.3;
    }

    .project-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .project-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .project-category {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 2px;
    }
    .project-card[data-cat="IoT & Hardware"] .project-category      { color: var(--accent); background: var(--accent-dim); }
    .project-card[data-cat="AI & Machine Learning"] .project-category{ color: var(--teal); background: var(--teal-dim); }
    .project-card[data-cat="Physics Research"] .project-category    { color: var(--violet); background: var(--violet-dim); }
    .project-card[data-cat="Software"] .project-category            { color: var(--green); background: var(--green-dim); }

    .project-links {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .project-link {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      transition: color 0.2s;
    }
    .project-link:hover { color: var(--text); }
    .project-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .project-subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }
    .project-desc {
      font-size: 0.88rem;
      font-weight: 300;
      color: var(--text-dim);
      line-height: 1.7;
      flex: 1;
      margin-bottom: 20px;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      padding: 3px 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text-muted);
    }

    /* ─────────────────────────────────────────────
       EDUCATION
       ───────────────────────────────────────────── */
    #education {}
    .edu-timeline {
      position: relative;
      padding-left: 32px;
    }
    .edu-timeline::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }
    .edu-item {
      position: relative;
      padding-bottom: 48px;
    }
    .edu-item:last-child { padding-bottom: 0; }
    .edu-item::before {
      content: "";
      position: absolute;
      left: -36px;
      top: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .edu-dates {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .edu-institution {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .edu-degree {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .edu-location {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .edu-details {
      font-size: 0.88rem;
      font-weight: 300;
      color: var(--text-dim);
      line-height: 1.7;
      max-width: 600px;
    }
    .edu-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    /* ─────────────────────────────────────────────
       PUBLICATIONS
       ───────────────────────────────────────────── */
    #publications {}
    .pub-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .pub-card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-surface);
      transition: border-color 0.3s;
    }
    .pub-card:hover { border-color: var(--border-hover); }
    .pub-status {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--violet);
      background: var(--violet-dim);
      padding: 3px 8px;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .pub-title {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 10px;
    }
    .pub-authors {
      font-size: 0.88rem;
      font-weight: 300;
      color: var(--text-dim);
      margin-bottom: 14px;
    }
    .pub-authors strong { color: var(--text); font-weight: 500; }
    .pub-desc {
      font-size: 0.88rem;
      font-weight: 300;
      color: var(--text-dim);
      line-height: 1.7;
      max-width: 640px;
      margin-bottom: 16px;
    }
    .pub-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      transition: color 0.2s;
    }
    .pub-link:hover { color: var(--text); }

    ? `<a class="btn-resume" href="${CONFIG.resumeUrl}" target="_blank">Résumé</a>`

  $("nav").innerHTML = `

      <ul class="nav-links">
        ${links.map(l=>`<li><a href="#${l.toLowerCase()}">${l}</a></li>`).join("")}
        ${resumeBtn ? `<li>${resumeBtn}</li>` : ""}
      </ul>
      <div class="nav-hamburger" id="hamburger" aria-label="Menu" role="button" tabindex="0">
        <span></span><span></span><span></span>
      </div>
    </div>`;

  $("mobileMenu").innerHTML = `
    <button class="mobile-menu-close" id="menuClose" aria-label="Close menu">✕</button>
    ${links.map(l=>`<a href="#${l.toLowerCase()}" class="menu-link">${l}</a>`).join("")}
    ${CONFIG.resumeUrl ? `<a href="${CONFIG.resumeUrl}" target="_blank">Resume ↗</a>` : ""}`;

  // Scroll handler
  window.addEventListener("scroll", () => {
    $("nav").classList.toggle("scrolled", window.scrollY > 40);
    // Active link
    const sections = links.map(l => document.getElementById(l.toLowerCase()));
    const scrollY = window.scrollY + 80;
    sections.forEach((sec, i) => {
      if (!sec) return;
      const link = $("nav").querySelector(`a[href="#${links[i].toLowerCase()}"]`);
      if (!link) return;
      const active = scrollY >= sec.offsetTop && scrollY < sec.offsetTop + sec.offsetHeight;
      link.classList.toggle("active", active);
    });
  });

  // Hamburger
  $("hamburger").addEventListener("click", () => $("mobileMenu").classList.add("open"));
  $("menuClose").addEventListener("click", () => $("mobileMenu").classList.remove("open"));
  $("mobileMenu").querySelectorAll("a").forEach(a => {
    a.addEventListener("click", () => $("mobileMenu").classList.remove("open"));
  });
}

            <div class="info-content">
              <div class="info-key">${row.key}</div>
              <div class="info-val">${row.href
                ? `<a href="${row.href}" target="_blank" rel="noopener">${row.value}</a>`
                : row.value}</div>
            </div>
          </div>`).join("")}
      </div>
    </div>`;
}

/* ── Projects ─────────────────────────────────────────────────── */
function renderProjects() {
  const categories = ["All", ...new Set(CONFIG.projects.map(p => p.category))];

  $("projectsContent").innerHTML = `
    <p class="section-label reveal">Projects</p>
    <h2 class="section-title reveal">Things I've <em>built</em></h2>
    <div class="projects-filter reveal">
      ${categories.map((c, i) =>
        `<button class="filter-btn${i===0?" active":""}" data-filter="${c}">${c}</button>`
      ).join("")}
    </div>
    <div class="projects-grid">
      ${CONFIG.projects.map((p, idx) => {
        const imageHtml = p.image
          ? `<div class="project-image-wrap"><img src="${p.image}" alt="${p.title} screenshot" loading="lazy" /></div>`
          : `<div class="project-image-wrap"><div class="project-image-placeholder">
               <span class="placeholder-icon">${categoryPlaceholderIcon(p.category)}</span>
             </div></div>`;
        const githubLink = p.github
          ? `<a class="project-link" href="${p.github}" target="_blank" rel="noopener">
               <span>⬡</span> GitHub</a>` : "";
        const demoLink = p.demo
          ? `<a class="project-link" href="${p.demo}" target="_blank" rel="noopener">
               <span>↗</span> ${p.demoLabel || "Live"}</a>` : "";

        return `
          <article class="project-card reveal reveal-delay-${(idx % 3) + 1}${p.featured ? " featured" : ""}"
                   data-cat="${p.category}"
                   data-github="${p.github || ""}">
            ${imageHtml}
            <div class="project-body">
              <div class="project-meta">
                <span class="project-category">${p.category}</span>
                <div class="project-links">${githubLink}${demoLink}</div>
              </div>
              <h3 class="project-title">${p.title}</h3>
              <p class="project-subtitle">${p.subtitle}</p>
              <p class="project-desc">${p.description}</p>
              <div class="project-tags">
                ${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}
              </div>
            </div>
          </article>`;
      }).join("")}
    </div>`;

  // Filter logic
  $("projectsContent").querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      $("projectsContent").querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const filter = btn.dataset.filter;
      $("projectsContent").querySelectorAll(".project-card").forEach(card => {
        const match = filter === "All" || card.dataset.cat === filter;
        card.classList.toggle("hidden", !match);
      });
    });
  });

  // Click-card → open GitHub (skip if click landed on an inner <a>)
  $("projectsContent").querySelectorAll(".project-card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest("a")) return; // let inner links handle themselves
      const url = card.dataset.github;
      if (url) window.open(url, "_blank", "noopener,noreferrer");
    });
  });
}

/* ── Scroll Reveal (IntersectionObserver) ────────────────────── */
function initReveal() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("visible");
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });

  document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
}

/* ── Init ─────────────────────────────────────────────────────── */
function init() {
  initMeta();
  renderNav();
  renderHero();
  renderAbout();
  renderSkills();
  renderProjects();
  renderPublications();
  renderEducation();
  renderContact();
  renderFooter();
  // Small delay lets the DOM settle before attaching observers
  requestAnimationFrame(() => requestAnimationFrame(initReveal));
}

document.addEventListener("DOMContentLoaded", init);
</script>
